name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # The same self-hosted runner used for DigitalTwinWebApp and life-os.
    # It needs docker access on the LXC (192.168.1.214).
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Build and start
        run: docker compose up -d --build

      - name: Smoke test the container
        run: |
          for i in $(seq 1 10); do
            if docker compose exec -T web wget -qO- http://localhost/ > /dev/null; then
              echo "site is serving"; exit 0
            fi
            sleep 3
          done
          echo "site did not come up"; docker compose logs --tail 50 web; exit 1

      - name: Tidy old images
        if: always()
        run: docker image prune -f --filter "until=336h"
