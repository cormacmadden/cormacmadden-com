server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/xml;

  # Astro builds /page/index.html; serve /page without a trailing slash.
  location / {
    try_files $uri $uri/index.html $uri.html =404;
  }

  # Hashed assets can be cached forever.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Self-hosted fonts: same name = same file, so cache them hard.
  location /fonts/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /media/ {
    add_header Cache-Control "public, max-age=604800";
  }

  # 3D models for <model-viewer>. .glb isn't in nginx's default mime.types.
  location /models/ {
    default_type model/gltf-binary;
    add_header Cache-Control "public, max-age=604800";
  }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  error_page 404 /404.html;
}
