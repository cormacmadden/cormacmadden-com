# Serves the built site on port 8088 of the docker LXC (192.168.1.214).
#
#   docker compose up -d --build
#
# The existing `minipc-docker` Cloudflare tunnel routes cormacmadden.com and
# www.cormacmadden.com to http://192.168.1.214:8088, the same way it already
# routes cloud/claw/gymin. Nothing is forwarded on the router and this port is
# not reachable from outside the LAN. See docs/DEPLOY.md.
name: cormacmadden-com

services:
  web:
    build: .
    image: cormacmadden-com:latest
    container_name: cormacmadden-com
    restart: unless-stopped
    ports:
      - "8088:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
